name: Power BI Daily Scraper

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 10:00 AM UTC
  workflow_dispatch:      # Enables manual trigger button in GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests playwright
          playwright install chromium

      - name: Execute Power BI Scraper
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: python pbi_exporter.py
